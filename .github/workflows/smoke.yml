name: smoke

# 공개본 CI. 내부 회귀 스위트(tests/)는 공개하지 않으므로 `unittest discover -s tests` 를
# 쓸 수 없다 — 그렇게 두면 0 개를 찾고도 OK 로 통과해 거짓 초록불이 된다.
# 대신 .github/smoke.py 가 save → resume → list 왕복 산출물을 직접 단언한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Smoke (default locale)
        env:
          PYTHONUTF8: "1"
        run: python .github/smoke.py

      - name: Smoke (HANDOFF_LANG=en)
        env:
          PYTHONUTF8: "1"
          HANDOFF_LANG: "en"
        run: python .github/smoke.py
